<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postgres Internals: The Update Lifecycle</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .process-glow { box-shadow: 0 0 15px currentColor; }
        .transition-all { transition-property: all; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 300ms; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- ICONS (Inlined for stability without external library dependency) ---
        const IconBase = ({ children, size = 24, className = "" }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width={size} 
                height={size} 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className}
            >
                {children}
            </svg>
        );

        const ChevronLeft = (props) => <IconBase {...props}><path d="m15 18-6-6 6-6"/></IconBase>;
        const ChevronRight = (props) => <IconBase {...props}><path d="m9 18 6-6-6-6"/></IconBase>;
        const HardDrive = (props) => <IconBase {...props}><line x1="22" x2="2" y1="12" y2="12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" x2="6.01" y1="16" y2="16"/><line x1="10" x2="10.01" y1="16" y2="16"/></IconBase>;
        const Cpu = (props) => <IconBase {...props}><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/></IconBase>;
        const Memory = (props) => <IconBase {...props}><path d="M6 19v-3"/><path d="M9 19v-3"/><path d="M12 19v-3"/><path d="M15 19v-3"/><path d="M18 19v-3"/><path d="M12 5V2"/><path d="M12 22v-3"/><path d="M6 5V2"/><path d="M18 5V2"/><path d="M2 5h20v14H2z"/></IconBase>;
        const Save = (props) => <IconBase {...props}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></IconBase>;
        const RefreshCw = (props) => <IconBase {...props}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></IconBase>;
        const Database = (props) => <IconBase {...props}><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></IconBase>;
        const ArrowRight = (props) => <IconBase {...props}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></IconBase>;
        const Lock = (props) => <IconBase {...props}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></IconBase>;
        const AlertCircle = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></IconBase>;
        const CheckCircle = (props) => <IconBase {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></IconBase>;

        // --- DATA & STATE DEFINITIONS ---

        const STEPS = [
            {
                id: 0,
                title: "State 0: The Calm",
                process: "Idle",
                desc: "System is idle. Data is consistent on disk. No active transaction.",
                why: "Before we begin, the database is at rest. The Page in RAM matches the Page on Disk.",
                details: {
                    txnStatus: "None",
                    dirty: false,
                    locks: "None"
                }
            },
            {
                id: 1,
                title: "State 1: Fetch & Lock",
                process: "Backend Process",
                desc: "User initiates UPDATE. Backend process reads Page 42 into Shared Buffers (RAM) and acquires an Exclusive Lock.",
                why: "We cannot edit a file directly on the disk. We must load the 8KB page into RAM to modify bits within it.",
                details: {
                    txnStatus: "In Progress (XID 305)",
                    dirty: false,
                    locks: "Exclusive (Page 42)"
                }
            },
            {
                id: 2,
                title: "State 2: The Mutation (Dirty RAM)",
                process: "Backend Process",
                desc: "MVCC Update happens in RAM. Old tuple marked dead (xmax). New tuple created. LSN updated. Page marked DIRTY.",
                why: "Postgres writes the new data to memory immediately. It does NOT touch the main disk file yet (performance).",
                details: {
                    txnStatus: "In Progress (XID 305)",
                    dirty: true,
                    locks: "Exclusive (Page 42)"
                }
            },
            {
                id: 3,
                title: "State 3: WAL Buffer Fill",
                process: "Backend Process",
                desc: "Backend constructs a 'Log Record' describing the change and places it in the WAL Buffer (RAM).",
                why: "Before releasing the lock or confirming success, we must prepare the safety net receipt.",
                details: {
                    txnStatus: "In Progress (XID 305)",
                    dirty: true,
                    locks: "Exclusive (Page 42)"
                }
            },
            {
                id: 4,
                title: "State 4: COMMIT (WAL Flush)",
                process: "WAL Writer",
                desc: "User types COMMIT. WAL Writer forces the WAL Buffer content to the WAL Disk File using fsync().",
                why: "Durability is achieved here. Even if power fails now, we can reconstruct the change from the log. The Heap File is still old!",
                details: {
                    txnStatus: "COMMITTED",
                    dirty: true,
                    locks: "Released"
                }
            },
            {
                id: 5,
                title: "State 5: Checkpoint (Sync Data)",
                process: "Checkpointer",
                desc: "Background Checkpointer wakes up. Detects Dirty Page 42. Writes RAM content to Heap File on Disk.",
                why: "Reconciling the main data file. This happens lazily to bundle many random writes into sequential writes.",
                details: {
                    txnStatus: "COMMITTED",
                    dirty: false,
                    locks: "None"
                }
            }
        ];

        const TUPLE_A_INIT = { id: 1, age: 29, xmin: 100, xmax: 0 };
        const TUPLE_A_DEAD = { id: 1, age: 29, xmin: 100, xmax: 305 };
        const TUPLE_B = { id: 1, age: 30, xmin: 305, xmax: 0 };

        const MemoryBlock = ({ title, children, active, className }) => (
            <div className={`border-2 rounded-xl p-4 transition-all ${active ? 'border-blue-500 bg-blue-900/20' : 'border-slate-700 bg-slate-900'} ${className}`}>
                <div className="flex items-center gap-2 mb-3 text-sm font-bold uppercase tracking-wider text-slate-400">
                    <Memory size={16} />
                    {title} (Volatile)
                </div>
                {children}
            </div>
        );

        const DiskBlock = ({ title, children, active, className }) => (
            <div className={`border-2 rounded-xl p-4 transition-all ${active ? 'border-amber-500 bg-amber-900/20' : 'border-slate-700 bg-black'} ${className}`}>
                <div className="flex items-center gap-2 mb-3 text-sm font-bold uppercase tracking-wider text-slate-400">
                    <HardDrive size={16} />
                    {title} (Persistent)
                </div>
                {children}
            </div>
        );

        const Tuple = ({ data, isNew, isDead }) => (
            <div className={`text-xs font-mono p-2 rounded border mb-1 transition-all
                ${isDead ? 'bg-red-900/30 border-red-800 text-red-400 opacity-70 line-through decoration-red-500/50' : 
                  isNew ? 'bg-green-900/30 border-green-500 text-green-300 scale-105' : 
                  'bg-slate-800 border-slate-600 text-slate-300'}`}>
                <div className="flex justify-between font-bold border-b border-white/10 pb-1 mb-1">
                    <span>ID: {data.id}</span>
                    <span>Age: {data.age}</span>
                </div>
                <div className="grid grid-cols-2 gap-x-2 text-[10px] opacity-80">
                    <span>xmin: {data.xmin}</span>
                    <span>xmax: {data.xmax}</span>
                </div>
            </div>
        );

        const ProcessBadge = ({ name, icon: Icon, isActive, color }) => (
            <div className={`flex flex-col items-center gap-2 p-3 rounded-lg transition-all duration-500 ${isActive ? `bg-${color}-500/20 scale-110 ring-2 ring-${color}-500` : 'opacity-40 grayscale'}`}>
                <div className={`p-2 rounded-full bg-${color}-500 text-white shadow-lg`}>
                    <Icon size={24} />
                </div>
                <span className={`text-xs font-bold uppercase ${isActive ? `text-${color}-400` : 'text-slate-500'}`}>{name}</span>
            </div>
        );

        const Arrow = ({ active, vertical = false }) => (
            <div className={`flex items-center justify-center transition-opacity duration-500 ${active ? 'opacity-100' : 'opacity-10'}`}>
                {vertical ? 
                    <div className="h-12 w-1 bg-gradient-to-b from-blue-500 to-amber-500 rounded-full" /> :
                    <ArrowRight className="text-blue-500 animate-pulse" size={32} />
                }
            </div>
        );

        const App = () => {
            const [step, setStep] = useState(0);
            const current = STEPS[step];

            // Derived State Logic
            const ramHasPage = step >= 1;
            const mutationHappened = step >= 2;
            const walInBuffer = step === 3; // Only visible in buffer during this step for simplicity logic (or 2-4)
            const walOnDisk = step >= 4;
            const heapSynced = step >= 5;

            // Page State Logic
            const ramPageTuples = !mutationHappened ? [TUPLE_A_INIT] : [TUPLE_A_DEAD, TUPLE_B];
            const diskHeapTuples = !heapSynced ? [TUPLE_A_INIT] : [TUPLE_A_DEAD, TUPLE_B];
            
            const ramLsn = mutationHappened ? "0/2000" : "0/1000";
            const ramDirty = mutationHappened && !heapSynced;
            
            const walContent = step >= 3 ? "Txn 305: UPDATE Page 42 (Offset 1->2)" : "Empty";

            return (
                <div className="min-h-screen p-4 md:p-8 max-w-7xl mx-auto flex flex-col gap-6">
                    
                    {/* HEADER */}
                    <div className="flex justify-between items-end border-b border-slate-800 pb-4">
                        <div>
                            <h1 className="text-3xl font-bold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">Postgres Internal Lifecycle</h1>
                            <p className="text-slate-400 mt-1">Visualizing MVCC, WAL, and Checkpoints step-by-step</p>
                        </div>
                        <div className="flex gap-2">
                            <button 
                                onClick={() => setStep(Math.max(0, step - 1))}
                                disabled={step === 0}
                                className="p-2 rounded hover:bg-slate-800 disabled:opacity-30 transition-colors"
                            >
                                <ChevronLeft />
                            </button>
                            <div className="px-4 py-2 bg-slate-800 rounded font-mono font-bold text-blue-400">
                                {step} / {STEPS.length - 1}
                            </div>
                            <button 
                                onClick={() => setStep(Math.min(STEPS.length - 1, step + 1))}
                                disabled={step === STEPS.length - 1}
                                className="p-2 rounded hover:bg-slate-800 disabled:opacity-30 transition-colors"
                            >
                                <ChevronRight />
                            </button>
                        </div>
                    </div>

                    {/* PROCESS INDICATORS */}
                    <div className="flex justify-center gap-12 py-4 bg-slate-900/50 rounded-xl border border-slate-800">
                        <ProcessBadge name="Backend Process" icon={Cpu} isActive={current.process === "Backend Process"} color="blue" />
                        <ProcessBadge name="WAL Writer" icon={Save} isActive={current.process === "WAL Writer"} color="purple" />
                        <ProcessBadge name="Checkpointer" icon={RefreshCw} isActive={current.process === "Checkpointer"} color="amber" />
                    </div>

                    {/* MAIN VISUALIZATION GRID */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8 relative">
                        
                        {/* --- RAM SECTION --- */}
                        <div className="space-y-6">
                            <div className="flex items-center gap-2 text-blue-400 font-bold text-lg">
                                <Memory /> Shared Buffers (RAM)
                            </div>

                            {/* WAL BUFFER */}
                            <MemoryBlock title="WAL Buffer" active={step === 2 || step === 3} className="h-32 flex flex-col justify-center items-center text-center">
                                {step >= 3 || (step === 2 && current.id === 2) ? ( // Simplified visualization
                                    <div className={`p-3 rounded border border-purple-500/50 bg-purple-900/20 text-purple-300 font-mono text-sm transition-all duration-500 ${step === 4 ? 'translate-y-20 opacity-0' : ''}`}>
                                        <div className="text-[10px] text-purple-400 uppercase mb-1">Log Record</div>
                                        {walContent}
                                    </div>
                                ) : (
                                    <span className="text-slate-600 italic">Empty</span>
                                )}
                            </MemoryBlock>

                            {/* SHARED BUFFERS PAGE 42 */}
                            <MemoryBlock title="Page 42 (8KB Block)" active={ramHasPage} className="min-h-[280px]">
                                {ramHasPage ? (
                                    <div className="relative">
                                        {/* Page Header Info */}
                                        <div className="flex justify-between items-center text-[10px] uppercase font-bold text-slate-500 mb-2 border-b border-slate-700 pb-2">
                                            <span className="flex items-center gap-1">
                                                <Database size={12}/> Header
                                            </span>
                                            <div className="flex gap-3">
                                                <span className={ramLsn !== "0/1000" ? "text-yellow-400 transition-colors duration-500" : ""}>LSN: {ramLsn}</span>
                                                <span className={`flex items-center gap-1 ${ramDirty ? "text-red-500 animate-pulse" : "text-green-500"}`}>
                                                    {ramDirty ? <AlertCircle size={10}/> : <CheckCircle size={10}/>}
                                                    DIRTY: {ramDirty ? "1" : "0"}
                                                </span>
                                            </div>
                                        </div>

                                        {/* Tuples */}
                                        <div className="space-y-2">
                                            {ramPageTuples.map((t, i) => (
                                                <Tuple key={i} data={t} isNew={t.xmin === 305} isDead={t.xmax !== 0} />
                                            ))}
                                        </div>
                                        
                                        {/* Lock Indicator */}
                                        {current.details.locks.includes("Exclusive") && (
                                            <div className="absolute -top-2 -right-2 bg-yellow-500 text-black p-1 rounded-full shadow-lg animate-bounce">
                                                <Lock size={12} />
                                            </div>
                                        )}
                                    </div>
                                ) : (
                                    <div className="h-full flex items-center justify-center text-slate-600 italic">
                                        Not Loaded
                                    </div>
                                )}
                            </MemoryBlock>
                        </div>

                        {/* --- DISK SECTION --- */}
                        <div className="space-y-6">
                            <div className="flex items-center gap-2 text-amber-500 font-bold text-lg">
                                <HardDrive /> Physical Disk
                            </div>

                             {/* WAL FILE */}
                            <DiskBlock title="WAL File (pg_wal/000...)" active={walOnDisk} className="h-32 flex flex-col justify-center items-center text-center">
                                {walOnDisk ? (
                                    <div className="w-full flex flex-col gap-1">
                                        <div className="p-2 rounded border border-purple-500/30 bg-purple-900/10 text-purple-400 font-mono text-xs opacity-50">
                                            ...previous logs...
                                        </div>
                                        <div className="p-2 rounded border border-green-500 bg-green-900/30 text-green-400 font-mono text-sm shadow-[0_0_10px_rgba(74,222,128,0.2)]">
                                            LSN 0/2000: UPDATE Page 42
                                        </div>
                                    </div>
                                ) : (
                                    <div className="text-slate-600 text-sm">Waiting for fsync()...</div>
                                )}
                            </DiskBlock>

                            {/* HEAP FILE */}
                            <DiskBlock title="Heap File (base/16384/16385)" active={heapSynced} className="min-h-[280px]">
                                <div className="relative">
                                     <div className="flex justify-between items-center text-[10px] uppercase font-bold text-slate-500 mb-2 border-b border-slate-700 pb-2">
                                        <span>Page 42 On Disk</span>
                                        <span className={heapSynced ? "text-green-500" : "text-slate-500"}>
                                            Matches RAM? {heapSynced ? "YES" : "NO"}
                                        </span>
                                    </div>

                                    <div className="space-y-2 opacity-80">
                                        {diskHeapTuples.map((t, i) => (
                                            <Tuple key={i} data={t} isNew={t.xmin === 305} isDead={t.xmax !== 0} />
                                        ))}
                                    </div>
                                </div>
                            </DiskBlock>
                        </div>

                        {/* Arrows Layer */}
                         <div className="absolute inset-0 pointer-events-none hidden md:block">
                            {/* Fetch Arrow */}
                            <div className={`absolute top-[60%] left-[50%] -translate-x-1/2 -translate-y-1/2 transition-opacity duration-300 ${step === 1 ? 'opacity-100' : 'opacity-0'}`}>
                                <div className="flex items-center gap-2 text-blue-500 font-bold text-xs bg-slate-900 p-1">
                                    <ChevronLeft /> READ
                                </div>
                            </div>

                             {/* Flush Arrow */}
                            <div className={`absolute top-[20%] left-[50%] -translate-x-1/2 -translate-y-1/2 transition-opacity duration-300 ${step === 4 ? 'opacity-100' : 'opacity-0'}`}>
                                <div className="flex items-center gap-2 text-purple-500 font-bold text-xs bg-slate-900 p-1 animate-pulse">
                                    FSYNC <ChevronRight />
                                </div>
                            </div>
                            
                            {/* Checkpoint Arrow */}
                            <div className={`absolute top-[60%] left-[50%] -translate-x-1/2 -translate-y-1/2 transition-opacity duration-300 ${step === 5 ? 'opacity-100' : 'opacity-0'}`}>
                                <div className="flex items-center gap-2 text-amber-500 font-bold text-xs bg-slate-900 p-1">
                                    WRITE <ChevronRight />
                                </div>
                            </div>
                        </div>

                    </div>

                    {/* INFO PANEL */}
                    <div className="bg-slate-900 rounded-xl p-6 border-l-4 border-blue-500 shadow-lg">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div className="md:col-span-2">
                                <h3 className="text-xl font-bold text-white mb-2 flex items-center gap-2">
                                    {current.title}
                                </h3>
                                <p className="text-slate-300 mb-4 leading-relaxed">
                                    {current.desc}
                                </p>
                                <div className="bg-slate-800/50 p-4 rounded-lg border border-slate-700">
                                    <span className="text-blue-400 font-bold uppercase text-xs tracking-wider block mb-1">Why this happens</span>
                                    <p className="text-slate-400 text-sm italic">
                                        "{current.why}"
                                    </p>
                                </div>
                            </div>
                            <div className="bg-black/40 p-4 rounded-lg font-mono text-xs text-slate-300 space-y-2 border border-slate-800">
                                <div className="text-slate-500 font-bold uppercase border-b border-slate-800 pb-1 mb-2">System State</div>
                                <div className="flex justify-between">
                                    <span>Txn Status:</span>
                                    <span className={current.details.txnStatus === "COMMITTED" ? "text-green-400 font-bold" : "text-yellow-400"}>
                                        {current.details.txnStatus}
                                    </span>
                                </div>
                                <div className="flex justify-between">
                                    <span>Page 42 Dirty:</span>
                                    <span className={current.details.dirty ? "text-red-400 font-bold" : "text-slate-500"}>
                                        {current.details.dirty.toString().toUpperCase()}
                                    </span>
                                </div>
                                <div className="flex justify-between">
                                    <span>Locks Held:</span>
                                    <span className="text-blue-300">{current.details.locks}</span>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
