# Postgres Learning Lab - Multi-Node Setup
# This setup includes a primary and replica for practicing replication

version: '3.8'

services:
  # ===========================================
  # PRIMARY POSTGRES (Main database for learning)
  # ===========================================
  postgres-primary:
    image: postgres:16
    container_name: postgres-primary
    hostname: postgres-primary
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: learn
      # Enable logical replication for CDC exercises
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "5432:5432"
    volumes:
      - postgres-primary-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
      - ./postgres-primary.conf:/etc/postgresql/postgresql.conf
    command: >
      postgres
      -c wal_level=logical
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on
      -c shared_preload_libraries='pg_stat_statements'
      -c pg_stat_statements.track=all
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - postgres-net

  # ===========================================
  # REPLICA POSTGRES (For replication exercises)
  # ===========================================
  postgres-replica:
    image: postgres:16
    container_name: postgres-replica
    hostname: postgres-replica
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-replica-data:/var/lib/postgresql/data
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - postgres-net
    # Note: Replication setup will be done manually in Day 8 exercises

  # ===========================================
  # PGADMIN (Visual database management)
  # ===========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@learn.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "8080:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres-primary
    networks:
      - postgres-net

volumes:
  postgres-primary-data:
  postgres-replica-data:
  pgadmin-data:

networks:
  postgres-net:
    driver: bridge

